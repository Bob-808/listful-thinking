<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listful Thinking</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- SETUP SCREEN -->
  <div id="setup" class="screen">
    <h1 class="title">Listful Thinking</h1>

    <div class="card">
      <h2 class="section-title">Add Players</h2>

      <div class="player-input-row">
        <input id="playerInput" type="text" placeholder="Player name">
        <button onclick="addPlayer()" class="btn primary">Add</button>
      </div>

      <div id="playerList" class="player-list"></div>

      <button onclick="startGame()" class="btn start-btn">Start Game</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game" class="screen" style="display:none;">
    <div class="game-header">
      <div id="currentPlayer" class="current-player"></div>
    </div>

    <div class="card">
      <div id="question" class="question"></div>

      <div id="answers" class="answers"></div>

      <div id="players" class="players"></div>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle"></h2>
      <p id="modalMessage"></p>
      <button onclick="closeModal()" class="btn primary modal-btn">OK</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
